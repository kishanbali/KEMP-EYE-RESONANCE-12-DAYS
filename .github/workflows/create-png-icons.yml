name: Create PWA PNG Icons
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate PNG icons
        run: |
          python3 - <<'PY'
          import struct,zlib
          def png(path,n):
              w=h=n; bg=(7,16,25,255); cyan=(103,221,245,255); gold=(229,202,112,255)
              rows=[]
              for y in range(h):
                  row=bytearray([0])
                  for x in range(w):
                      nx,ny=(x-w/2)/(w*.34),(y-h/2)/(h*.20)
                      d=nx*nx+ny*ny
                      if abs(ny)<1.0 and abs(nx)<1.45 and abs(d-1)<.18: c=cyan
                      elif (x-w/2)**2+(y-h/2)**2<(w*.105)**2: c=gold
                      elif (x-w/2)**2+(y-h/2)**2<(w*.047)**2: c=bg
                      else: c=bg
                      row.extend(c)
                  rows.append(bytes(row))
              raw=b''.join(rows)
              def chunk(t,d): return struct.pack('>I',len(d))+t+d+struct.pack('>I',zlib.crc32(t+d)&0xffffffff)
              data=b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('>IIBBBBB',w,h,8,6,0,0,0))+chunk(b'IDAT',zlib.compress(raw,9))+chunk(b'IEND',b'')
              open(path,'wb').write(data)
          png('icon-192.png',192); png('icon-512.png',512)
          PY
      - name: Commit icons
        run: |
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add icon-192.png icon-512.png
          git diff --cached --quiet || git commit -m "Generate PWA PNG icons"
          git push
