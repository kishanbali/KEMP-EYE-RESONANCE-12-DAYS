name: Activate PWA
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add PWA hooks without changing the experience
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          changed=False
          if '<link rel="manifest"' not in s:
              s=s.replace('<meta name="viewport"', '<link rel="manifest" href="./manifest.json"><link rel="apple-touch-icon" href="./icon-192.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="viewport"', 1); changed=True
          if "serviceWorker.register('./service-worker.js')" not in s:
              marker='</script>'
              hook="<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js'));}</script>"
              pos=s.rfind(marker)
              s=s[:pos+len(marker)]+hook+s[pos+len(marker):]; changed=True
          if changed: p.write_text(s)
          PY
      - name: Commit PWA hooks
        run: |
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || git commit -m "Activate Resonance PWA"
          git push
